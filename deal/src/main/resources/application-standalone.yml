spring:
  liquibase:
    change-log: db/changelog/changelog-master.xml
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://localhost:5432/deal
    username: user
    password: pass
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:29092,localhost:39092,localhost:49092

deal:
  calculator-base-url: http://localhost:8081
  kafka:
    bootstrap: localhost:29092,localhost:39092,localhost:49092
    topic:
      finish-registration: "finish-registration"
      create-documents: "create-documents"
      send-documents: "send-documents"
      send-ses: "sens-ses"
      credit-issued: "credit-issued"
      statement-denied: "statement-denied"

server:
  port: 8082

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus