calculator:
  rate: 20
  insurance:
    costInPercent: 0.10
    discount: 5
  salary:
    discount: 1

springdoc:
  swagger-ui:
    url: /openapi.json

server:
  port: 8081

spring:
  application:
    name: calculator

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus